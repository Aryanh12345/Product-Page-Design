<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Page Design</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="hero">
                <div class="image">
                    <img src="image1.png">
                    <div class="btn">
                        <button class="m1"></button>
                        <button class="m2"></button>
                        <button class="m3"></button>
                    </div>
                </div>
                <div class="content">
                    <h1>Casual T Shirt</h1>
                    <h2>$15.00</h2>
                    <h5>30% OFF</h5>
                    <p class="para">Wrangler is an American manufacturer of <br>jeans and other clothing items, particularly <br>workwear.</p>
                    <div class="size">
                        <p class="s">Size</p>
                        <p class="s">S</p>
                        <p class="s">M</p>
                        <p class="s">l</p>
                        <p class="s">XL</p>
                        <p class="s">XXL</p>
                    </div>
                    <div class="color-design">
                        <p>Color</p>
                        <div class="colors">
                            <span class="color red"></span>
                            <span class="color green"></span>
                            <span class="color blue"></span>
                            <span class="color pink"></span>
                        </div>
                    </div>
                    <div class="quantity">
                        <p>Quantity</p>
                        <select name="quantity" id="number">
                            <option value="1" selected>1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    <button>Buy Now</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
